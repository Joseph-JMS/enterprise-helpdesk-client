<div class="container-fluid py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-8">
      
      <div class="mb-5">
        <h2 class="h4 fw-bold text-uppercase border-bottom pb-3" style="letter-spacing: 1px;">
          Nueva Solicitud de <span class="text-primary">Soporte</span>
        </h2>
        <p class="text-muted small">Por favor, detalle el inconveniente para que nuestro equipo técnico pueda ayudarle a la brevedad.</p>
      </div>

      <div class="card shadow-sm border-0 rounded-0">
        <div class="card-body p-4 p-md-5">
          <form>
            
            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Asunto del Problema</label>
              <input type="text" class="form-control form-control-lg rounded-0 border-2" 
                     placeholder="Ej. No puedo acceder al correo corporativo">
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Categoría</label>
                <select class="form-select rounded-0 border-2">
                  <option selected disabled>Seleccione una opción</option>
                  <option value="TI">Infraestructura TI</option>
                  <option value="SOFT">Software / Aplicaciones</option>
                  <option value="HARD">Hardware / Equipos</option>
                  <option value="ACC">Accesos y Contraseñas</option>
                </select>
              </div>

              <div class="col-md-6 mb-4">
                <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Urgencia</label>
                <select class="form-select rounded-0 border-2 border-start-0 border-md-start-2">
                  <option value="BAJA">Baja - Puedo trabajar con normalidad</option>
                  <option value="MEDIA" selected>Media - Afecta mis funciones parcialmente</option>
                  <option value="ALTA">Alta - Trabajo totalmente detenido</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Descripción del Incidente</label>
              <textarea class="form-control rounded-0 border-2" rows="6" 
                        placeholder="Describa los pasos para replicar el error o qué mensajes le aparecen..."></textarea>
            </div>

            <div class="mb-5">
              <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.7rem;">Capturas o Archivos (Opcional)</label>
              <div class="border border-2 border-dashed p-4 text-center bg-light rounded-0">
                <input type="file" class="form-control d-none" id="fileUpload" multiple>
                <label for="fileUpload" class="mb-0 cursor-pointer text-primary fw-bold small text-uppercase" style="cursor: pointer;">
                  Haga clic para subir o arrastre archivos aquí
                </label>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
              <button type="button" class="btn btn-link text-muted text-decoration-none text-uppercase small fw-bold">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary rounded-0 px-5 py-2 text-uppercase fw-bold shadow-sm">
                Enviar Ticket
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
