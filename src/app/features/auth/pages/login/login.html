<h4 class="fw-semibold mb-4 text-center">
  Iniciar sesión
</h4>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <!-- Usuario -->
  <div class="mb-3">
    <label class="form-label fw-medium">Usuario</label>
    <input
      type="text"
      class="form-control"
      placeholder="usuario@empresa.com"
      formControlName="username"
    />
  </div>

  <!-- Contraseña -->
  <div class="mb-4">
    <label class="form-label fw-medium">Contraseña</label>
    <input
      type="password"
      class="form-control"
      placeholder="••••••••"
      formControlName="password"
    />
  </div>

  <button class="btn btn-secondary w-100 py-2">
    Ingresar
  </button>

  <div class="text-center mt-3">
    <small>
      ¿No tienes cuenta?
      <a routerLink="/auth/register" class="text-decoration-none fw-semibold">
        Regístrate aquí
      </a>
    </small>
  </div>

</form>
