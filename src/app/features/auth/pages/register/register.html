<h4 class="fw-semibold mb-4 text-center">
    Crear cuenta
</h4>

<form>

    <!-- Nombre y Apellido en la misma fila -->
    <div class="row">
    <div class="col-12 col-md-6 mb-3">
        <label class="form-label fw-medium">Nombre</label>
        <input
        type="text"
        class="form-control"
        placeholder="Juan"
        />
    </div>

    <div class="col-12 col-md-6 mb-3">
        <label class="form-label fw-medium">Apellido</label>
        <input
        type="text"
        class="form-control"
        placeholder="Pérez"
        />
    </div>
    </div>

    <!-- Correo -->
    <div class="mb-3">
    <label class="form-label fw-medium">Correo electrónico</label>
    <input
        type="email"
        class="form-control"
        placeholder="juan.perez@empresa.com"
    />
    </div>

    <!-- Usuario -->
    <div class="mb-3">
    <label class="form-label fw-medium">Usuario</label>
    <input
        type="text"
        class="form-control"
        placeholder="juanperez"
    />
    </div>

    <!-- Contraseña -->
    <div class="mb-4">
    <label class="form-label fw-medium">Contraseña</label>
    <input
        type="password"
        class="form-control"
        placeholder="••••••••"
    />
    </div>

    <button class="btn btn-secondary w-100 py-2">
    Registrarse
    </button>

    <div class="text-center mt-3">
        <small>
            ¿Ya tienes cuenta?
            <a routerLink="/auth/login" class="text-decoration-none fw-semibold">
            Inicia sesión
            </a>
        </small>
    </div>

</form>
