<div class="container mx-auto p-6">
    @if (authService.hasRole('ROLE_ADMIN')) {
        @defer (on immediate) {
            <admin-dashboard />
        }
    } 
    @else if (authService.hasRole('ROLE_TECHNICIAN')) {
        @defer (on immediate) {
            <technician-dashboard />
        }
    } 
    @else {
        <user-dashboard />
    }
</div>
